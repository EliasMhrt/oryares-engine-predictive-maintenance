appId: com.oryares.enginepredictive
productName: Oryares Engine Predictive Maintenance
copyright: Copyright © 2026 Oryares

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json

extraResources:
  - from: ../backend/dist/oryares-backend
    to: backend

win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName} Setup ${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Oryares Engine Predictive Maintenance
  uninstallDisplayName: Oryares Engine Predictive Maintenance
